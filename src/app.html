<!doctype html>
<html lang="fr" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
		/>
		<meta name="theme-color" content="#f1ede5" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!--
			Which database this instance talks to. A separate file, loaded before the app, so that the same
			build can be handed to anybody and pointed at their own Supabase on the machine that serves it.
		-->
		<script src="%sveltekit.assets%/config.js"></script>
		<script>
			// Applies the preferences before the first render: without this, a reload in dark theme, in large
			// type or in Arabic causes a flash in the default settings.
			// No style value here: the colours and the steps live in app.css.
			(() => {
				const root = document.documentElement;

				try {
					const saved = JSON.parse(localStorage.getItem('familist:appearance') ?? '{}');
					// The preset modes below mirror THEME_PRESETS (themes.test.ts keeps them equal). A custom theme is
					// stored with its derived tokens precisely so they can be applied here, before the first frame.
					const DARK_PRESETS = ['night', 'dracula'];
					const LIGHT_PRESETS = ['pastel', 'foret', 'marine', 'corail', 'lavande', 'ardoise', 'dracula-light'];
					const id = saved.themeId ?? 'cream-forest';
					const custom = (saved.customThemes ?? []).find(t => t.id === id);
					const dark = custom
						? custom.base === 'dark'
						: DARK_PRESETS.includes(id)
							? true
							: LIGHT_PRESETS.includes(id)
								? false
								: saved.theme === 'dark' ||
									((saved.theme ?? 'system') === 'system' &&
										matchMedia('(prefers-color-scheme: dark)').matches);

					if (dark) root.classList.add('dark');
					root.dataset.theme = custom ? 'custom' : id;
					if (custom) {
						for (const [name, value] of Object.entries(custom.tokens ?? {}))
							root.style.setProperty('--' + name, value);
						root.style.setProperty('--radius', custom.radius + 'rem');
					}
					root.dataset.accent = saved.accentId ?? 'terracotta';
					root.dataset.scale = saved.fontScaleId ?? 'sm';
					root.dataset.font = saved.fontId ?? 'system';
					// Motion is refused before the first frame, otherwise the first page's entrances play all the
					// same.
					root.dataset.motion = saved.motion ?? 'system';
					// The thumb's side is set here too: applied afterwards, the create button would cross the screen
					// under the person's eyes.
					root.dataset.hand = saved.hand ?? 'right';

					const THEME_COLORS = {
						night: '#0f1420',
						dracula: '#282a36',
						pastel: '#fbf1f0',
						foret: '#e9f8e7',
						marine: '#ebe7e1',
						corail: '#fae9d7',
						lavande: '#f3eff8',
						ardoise: '#f4f3ea',
						'dracula-light': '#f6f4fa'
					};
					const bar = custom ? custom.tokens.background : (THEME_COLORS[id] ?? (dark ? '#0a0907' : null));
					if (bar)
						document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
				} catch {}

				try {
					const locale = localStorage.getItem('familist:locale');
					if (locale) {
						root.lang = locale;
						root.dir = locale === 'ar' ? 'rtl' : 'ltr';
					}
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
