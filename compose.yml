# The app, served on port 8080 by default.
#
# The image is pulled, not built: `docker compose up` needs nothing but Docker, and the machine that runs
# the app never compiles anything. To build it locally instead — a change of your own, or an architecture
# nobody publishes for — add `build: .` to the service, or `docker build -t familiste .` and point `image`
# at that name.
#
# The database is not declared here. Supabase is a dozen containers whose versions move together, and
# copying their compose file into this repository would mean maintaining a stale fork of it. The project
# already pins the Supabase CLI, which starts exactly that stack in Docker for you: `pnpm db:start` for a
# machine at home, or a project on supabase.com if you would rather not administer a database. Either way
# you end up with the two values below.
services:
  app:
    image: ghcr.io/techmefr/familiste:latest
    ports:
      - '${PORT:-8080}:80'
    environment:
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      # Optional: leave empty to change nothing, no other instance is affected.
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      # Optional: your own GoatCounter site code, cookie-free audience measurement. Leave empty for none.
      PUBLIC_GOATCOUNTER_SITE: ${PUBLIC_GOATCOUNTER_SITE:-}
      PUBLIC_OAUTH_PROVIDERS: ${PUBLIC_OAUTH_PROVIDERS:-}
    restart: unless-stopped

  # Optional push server for phones without Google services: `docker compose --profile ntfy up -d`.
  # Anyone may publish (the notify function does, without credentials); only accounts you create with
  # `docker compose exec ntfy ntfy user add` can read a topic. It must be reachable over HTTPS from the
  # internet, since the function runs on your Supabase, and its host goes in NTFY_ALLOWED_HOSTS.
  ntfy:
    image: binwiederhier/ntfy:latest
    profiles: ['ntfy']
    command: serve
    ports:
      - '${NTFY_PORT:-8081}:80'
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
    volumes:
      - ./docker/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    restart: unless-stopped

volumes:
  ntfy-cache:
  ntfy-data:
