name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: E2E suite
        type: choice
        options: [critical, full]
        default: critical

# Both jobs compile the app, which reads these variables at build time. They are the ones of the
# local Supabase stack, public by design: CI reaches no online project.
env:
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

# A push that catches up with another cancels the run in progress: what matters is the latest state
# of the branch, not every intermediate state.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs

  # Fast and with no external dependency: svelte-check plus unit coverage of the pure logic.
  # Kept apart from the rest to get feedback before Supabase has even finished starting in the
  # e2e job.
  check-and-unit:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true' || needs.scope.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a valid scope decision
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: denoland/setup-deno@v2
        if: needs.scope.outputs.backend == 'true'
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        if: needs.scope.outputs.backend == 'true'
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      - name: Type check
        if: needs.scope.outputs.app == 'true'
        run: pnpm run check

      - name: Unit tests (coverage ≥ 80% on pure logic)
        run: pnpm run test:coverage

      - name: Build
        if: needs.scope.outputs.app == 'true'
        run: pnpm run build

  e2e:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.suite == 'full' && 35 || 15 }}
    env:
      E2E_SUITE: ${{ github.event.inputs.suite || 'critical' }}
    steps:
      - name: Require a valid scope decision
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Hosted runners start with an empty database: start applies migrations and seed once.
      # Keep auth, storage and realtime; skip the admin UI and observability containers.
      - name: Local Supabase stack
        run: pnpm exec supabase start --exclude studio,postgres-meta,logflare,vector,supavisor

      - name: E2E (${{ env.E2E_SUITE }})
        run: pnpm exec playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
