name: Android compatibility

on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Android ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: play
            task: assemblePlayDebug
          - flavor: fdroid
            task: assembleFdroidDebug
    env:
      FAMILIST_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android
      - name: Check that Android excludes the Google scanner
        run: |
          if grep -q 'capacitor-mlkit-barcode-scanning' android/app/capacitor.build.gradle; then
            echo 'Unexpected Google scanner in Android build' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile APK
        working-directory: android
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}-debug
          path: android/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 7
